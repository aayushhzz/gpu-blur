<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="gpu-blur — CUDA 2D Image Blur Kernels and C++17 CPU Reference">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090F1D"/>
      <stop offset="55%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#0B2230"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="50%" stop-color="#22D3EE"/>
      <stop offset="100%" stop-color="#38BDF8"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.32"/>
      <stop offset="60%" stop-color="#10B981" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#0F172A" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="1" opacity="0.55"/>
    </pattern>
  </defs>

  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#bg)" stroke="#1E293B" stroke-width="2"/>
  <rect x="2" y="2" width="1196" height="316" rx="18" fill="url(#grid)" opacity="0.5"/>
  <circle cx="185" cy="160" r="145" fill="url(#glow)"/>

  <!-- Emblem: Tiled 3x3 Convolution Grid + Halo Frame + Gaussian Curve -->
  <g transform="translate(88, 66)">
    <!-- Halo border -->
    <rect x="0" y="0" width="188" height="188" rx="16" fill="#0B1324" stroke="#1E3A5F" stroke-width="2" stroke-dasharray="6 4"/>
    <!-- Inner tile frame -->
    <rect x="18" y="18" width="152" height="152" rx="10" fill="#0F1E36" stroke="#22D3EE" stroke-width="1.5" opacity="0.9"/>

    <!-- 3x3 Kernel weights visualization -->
    <rect x="30" y="30" width="38" height="38" rx="6" fill="#10B981" opacity="0.22"/>
    <rect x="75" y="30" width="38" height="38" rx="6" fill="#10B981" opacity="0.50"/>
    <rect x="120" y="30" width="38" height="38" rx="6" fill="#10B981" opacity="0.22"/>

    <rect x="30" y="75" width="38" height="38" rx="6" fill="#22D3EE" opacity="0.50"/>
    <rect x="75" y="75" width="38" height="38" rx="6" fill="url(#accent)" opacity="0.95"/>
    <rect x="120" y="75" width="38" height="38" rx="6" fill="#22D3EE" opacity="0.50"/>

    <rect x="30" y="120" width="38" height="38" rx="6" fill="#38BDF8" opacity="0.22"/>
    <rect x="75" y="120" width="38" height="38" rx="6" fill="#38BDF8" opacity="0.50"/>
    <rect x="120" y="120" width="38" height="38" rx="6" fill="#38BDF8" opacity="0.22"/>

    <!-- Center pixel crosshair -->
    <circle cx="94" cy="94" r="7" fill="#090F1D"/>
    <circle cx="94" cy="94" r="3" fill="#E0F2FE"/>
  </g>

  <!-- Gaussian bell curve subtle decorative wave on right -->
  <path d="M 860 250 C 920 250, 955 125, 1005 125 C 1055 125, 1090 250, 1150 250"
        fill="none" stroke="url(#accent)" stroke-width="2.5" opacity="0.35"/>
  <path d="M 885 250 C 935 250, 965 160, 1005 160 C 1045 160, 1075 250, 1125 250"
        fill="none" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="4 4" opacity="0.28"/>

  <!-- Text -->
  <g transform="translate(324, 102)">
    <rect x="0" y="-32" width="176" height="26" rx="13" fill="#10B981" fill-opacity="0.14" stroke="#10B981" stroke-opacity="0.45" stroke-width="1"/>
    <text x="88" y="-14" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="1.2" fill="#34D399">CUDA + C++17</text>

    <text x="0" y="48" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="62" font-weight="800" letter-spacing="-1.5" fill="#F8FAFC">gpu-blur</text>
    <text x="2" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="22" font-weight="400" fill="#94A3B8">2D Box, Shared-Memory Tiled &amp; Separable Gaussian Kernels</text>

    <!-- Feature pills -->
    <g transform="translate(0, 116)">
      <rect x="0" y="0" width="166" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="83" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">__shared__ Tile + Halo</text>

      <rect x="178" y="0" width="186" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="271" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">__constant__ 1D Gaussian</text>

      <rect x="376" y="0" width="164" height="30" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
      <text x="458" y="20" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#CBD5E1">CPU Reference &amp; Tests</text>
    </g>
  </g>
</svg>
